spring:
  security:
    user:
      name: ${SECURITY_NAME}
      password: ${SECURITY_PASSWORD}
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${PORT}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
  api:
    security:
      token:
        secret: ${TOKEN_SECRET}
      seed:
        user:
          email: ${SEED_USER_EMAIL}
          password: ${SEED_USER_PASS}
  config:
    import: "optional:file:.env[.properties]"
app:
  swagger:
    enabled: true
