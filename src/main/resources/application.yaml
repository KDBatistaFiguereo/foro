spring:
  application:
    name: forum
  profiles:
    active: dev
---
spring:
  config:
    activate:
      on-profile: dev
  security:
    user:
      name: ${SECURITY_NAME}
      password: ${SECURITY_PASSWORD}
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${PORT}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
  api:
    security:
      token:
        secret: ${TOKEN_SECRET}
      seed:
        user:
          email: ${SEED_USER_EMAIL}
          password: ${SEED_USER_PASS}
---
spring:
  config:
    activate:
      on-profile: test
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
  api:
    security:
      seed:
        user:
          email: test@example.com
          password: testpass
