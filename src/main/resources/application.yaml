spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${PORT}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    enabled: true

  app:
    swagger:
      enabled: false

  logging:
    level:
      root: INFO
      org.springframework: WARN
      org.hibernate.SQL: WARN
